<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal profile and mini-portfolio page of Jordy Musul, aspiring web developer.">
    <title>Jordy Musul | Mini-Portfolio</title>
</head>
<body>
<header>
    <h1>Jordy Musul</h1>
    <p class="tagline">Aspiring Front-End Developer | Problem Solver | Lifelong Learner</p>
</header>
<nav>
    <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>
<main> 
    <section id="contact">
        <h2>Contact Me</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="name">Full Name:</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    minlength="2" 
                    placeholder="e.g. Jean Dupont">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="e.g. jean.dupont@email.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    pattern="[0-9]{10}" 
                    placeholder="e.g. 0821234567"
                    title="Please enter a 10-digit phone number">
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">-- Please choose an option --</option>
                    <option value="job">Job Opportunity</option>
                    <option value="collaboration">Collaboration</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea 
                    id="message" 
                    name="message" 
                    rows="5" 
                    required 
                    minlength="10" 
                    placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>
    </section>
    <aside>
        <h2>Fun Fact</h2>
        <p>When I'm not coding, I'm usually experimenting with new recipes or hiking local trails.</p>
    </aside>
</main>
<footer>
    <p>&copy; 2025 Jean Dupont. All rights reserved.</p>
    <p>
        <a href="https://linkedin.com/in/tonprofil" target="_blank" rel="noopener">LinkedIn</a> |
        <a href="https://github.com/tonusername" target="_blank" rel="noopener">GitHub</a>
    </p>
</footer>
</body>
</html>
